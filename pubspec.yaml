name: inventory_sdn3margasari
description: "Sistem Inventarisasi Sarana dan Prasarana SDN 3 Margasari Purwakarta"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  go_router: ^14.8.1
  google_fonts: ^6.2.1
  intl: ^0.20.2
  image_picker: ^1.1.2
  file_picker: ^8.1.7
  uuid: ^4.5.1
  pdf: ^3.13.0
  printing: ^5.14.2
  universal_html: ^2.3.0
  http: ^1.6.0
  shared_preferences: ^2.5.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
